<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VotaYa — Ingreso</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/layout-login.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
  </head>

  <body>
    <div class="layout-login layout-login-columna">
      <div class="doc-icono"><i class="ti ti-id-badge"></i></div>
      <h1 class="doc-titulo">VotaYa</h1>
      <p class="doc-subtitulo">
        Ingresa tu número de documento para acceder a las votaciones
      </p>
      <div class="doc-form">
        <div id="alerta-login" class="alerta alerta-oculta"></div>
        <input
          type="text"
          id="numero-documento"
          class="doc-input"
          placeholder="Ej: 1005234567"
          maxlength="15"
          autocomplete="off"
          value="1005234570"
        />
        <button id="btn-ingresar" class="btn btn-primario btn-bloque">
          <i class="ti ti-arrow-right"></i> Ingresar a votar
        </button>
        <p class="texto-centro mt-16 doc-nota">
          ¿Eres administrador? <a href="pages/admin-login.html">Acceso admin</a>
        </p>
      </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
