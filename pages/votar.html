<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VotaYa — Votar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body class="pagina flex flex-col">

  <div id="topbar"></div>

  <div class="flex-1 flex justify-center py-8 px-4">
    <div class="w-full max-w-[960px]">

      <a href="encuestas.html" class="link-volver mb-4">
        <i class="ti ti-arrow-left"></i> Volver a encuestas
      </a>

      <div class="mb-6">
        <h2 id="enc-titulo" class="font-titulo font-bold text-texto text-xl mb-1">Cargando...</h2>
        <p id="enc-desc" class="text-sm text-texto-muted"></p>
      </div>

      <div id="alerta-voto" class="hidden"></div>

      <div id="opciones-voto">
        <div class="cargando"><i class="ti ti-loader"></i> Cargando opciones...</div>
      </div>

      <div id="panel-votar" class="hidden">
        <button id="btn-confirmar-voto" class="btn btn-primario w-full justify-center mt-4">
          <i class="ti ti-check"></i> Confirmar mi voto
        </button>
        <p class="text-sm text-texto-muted text-center mt-2">Tu voto es secreto y no puede modificarse después.</p>
      </div>

      <div id="confirmacion" class="card text-center py-8 px-5 hidden">
        <i class="ti ti-circle-check text-[56px] text-exito-texto block mb-4"></i>
        <h3 class="font-titulo font-bold text-texto text-lg mb-2">¡Voto registrado!</h3>
        <p class="text-texto-suave mb-5">Tu voto ha sido guardado correctamente.</p>
        <div class="flex gap-2.5 justify-center flex-wrap">
          <a href="resultados.html" id="btn-ver-resultados" class="btn btn-suave">
            <i class="ti ti-chart-bar"></i> Ver resultados
          </a>
          <a href="encuestas.html" class="btn btn-primario">
            <i class="ti ti-list"></i> Ver más encuestas
          </a>
        </div>
      </div>

    </div>
  </div>

  <template id="tpl-opcion-candidato">
    <div class="opcion-voto mb-2.5">
      <input type="radio" name="voto" class="opcion-radio accent-acento w-[18px] h-[18px] shrink-0">
      <div class="cand-foto-grande campo-iniciales avatar w-[52px] h-[52px] text-base"></div>
      <div>
        <div class="campo-nombre font-medium text-texto text-[15px]"></div>
        <div class="campo-lista text-xs text-texto-muted mt-0.5"></div>
        <div class="campo-propuesta text-xs text-texto-muted mt-0.5"></div>
      </div>
    </div>
  </template>

  <template id="tpl-opcion-texto">
    <div class="opcion-voto mb-2.5">
      <input type="radio" name="voto" class="opcion-radio accent-acento w-[18px] h-[18px] shrink-0">
      <div>
        <div class="campo-nombre font-medium text-texto text-[15px]"></div>
      </div>
    </div>
  </template>

  <script src="../js/app.js"></script>
  <script src="../js/votar.js"></script>
</body>
</html>
