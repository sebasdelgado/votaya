<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VotaYa — Panel admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body class="pagina flex flex-col">

  <div id="topbar"></div>
  <div id="sidebar"></div>

  <main class="main-admin ml-0 md:ml-sidebar-w">
    <div class="py-5 px-3.5 md:py-7 md:px-10 max-w-[1400px]">

      <div class="flex flex-col md:flex-row items-start md:justify-between gap-4 mb-6">
        <div>
          <h2 class="font-titulo font-bold text-texto text-xl mb-1">Panel de administración</h2>
          <p class="text-sm text-texto-muted">Resumen general del sistema de votaciones</p>
        </div>
        <a href="admin-encuesta-nueva.html" class="btn btn-primario">
          <i class="ti ti-plus"></i> Nueva encuesta
        </a>
      </div>

      <div id="stats-panel" class="stats-grid mb-6"></div>

      <div class="card">
        <div class="flex items-center justify-between gap-3 mb-4">
          <h3 class="font-titulo font-bold text-texto text-lg">Todas las encuestas</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr>
                <th class="tabla-th">Encuesta</th>
                <th class="tabla-th">Tipo</th>
                <th class="tabla-th">Estado</th>
                <th class="tabla-th">Votos</th>
                <th class="tabla-th">Cierre</th>
                <th class="tabla-th">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-encuestas">
              <tr><td colspan="6" class="cargando">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <template id="tpl-stat-card">
    <div class="stat-card">
      <div class="campo-label stat-label"></div>
      <div class="campo-valor stat-valor"></div>
    </div>
  </template>

  <template id="tpl-fila-encuesta">
    <tr class="hover:bg-fondo">
      <td class="campo-titulo font-medium text-texto tabla-td"></td>
      <td class="tabla-td">
        <span class="campo-tipo badge badge-tipo"></span>
      </td>
      <td class="campo-estado tabla-td"></td>
      <td class="campo-votos tabla-td text-texto-suave"></td>
      <td class="campo-cierre tabla-td text-texto-suave"></td>
      <td class="tabla-td">
        <div class="flex gap-1.5 flex-wrap">
          <a class="enlace-resultados btn btn-chico btn-suave">
            <i class="ti ti-chart-bar"></i> Resultados
          </a>
          <button class="btn-cerrar-encuesta btn btn-chico btn-alerta">
            <i class="ti ti-lock"></i> Cerrar
          </button>
          <button class="btn-eliminar-encuesta btn btn-chico btn-peligro">
            <i class="ti ti-trash"></i>
          </button>
        </div>
      </td>
    </tr>
  </template>

  <script src="../js/app.js"></script>
  <script src="../js/admin-panel.js"></script>
</body>
</html>
