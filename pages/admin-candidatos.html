<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VotaYa — Candidatos</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout-admin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body class="layout-admin">

  <nav class="topbar-admin">
    <div class="topbar-admin-izq">
      <span class="topbar-logo">Vota<span>Ya</span></span>
      <span class="topbar-admin-badge">Administrador</span>
    </div>
  </nav>

  <aside class="sidebar">
    <p class="sidebar-seccion">Principal</p>
    <a href="admin-panel.html" class="sidebar-link">
      <i class="ti ti-layout-dashboard"></i> Panel
    </a>
    <p class="sidebar-seccion">Gestión</p>
    <a href="admin-encuesta-nueva.html" class="sidebar-link">
      <i class="ti ti-plus"></i> Nueva encuesta
    </a>
    <a href="admin-candidatos.html" class="sidebar-link activo">
      <i class="ti ti-user-star"></i> Candidatos
    </a>
    <a href="admin-votantes.html" class="sidebar-link">
      <i class="ti ti-id-badge"></i> Votantes
    </a>
    <div class="sidebar-footer">
      <button id="btn-cerrar-sesion" class="btn btn-xs btn-peligro btn-bloque">
        <i class="ti ti-logout"></i> Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="admin-body">
    <div class="admin-contenido">

      <div class="pagina-header">
        <h2>Gestión de candidatos</h2>
        <p>Registra los candidatos que participarán en las votaciones</p>
      </div>

      <div id="alerta-candidato" class="alerta alerta-oculta"></div>

      <div class="grid-2">

        <div class="card">
          <h3 class="mb-16">Registrar candidato</h3>
          <div class="form-grupo">
            <label for="cand-nombre">Nombre</label>
            <input type="text" id="cand-nombre" class="form-input" placeholder="Ej: Juan">
          </div>
          <div class="form-grupo">
            <label for="cand-apellido">Apellido</label>
            <input type="text" id="cand-apellido" class="form-input" placeholder="Ej: Pérez">
          </div>
          <div class="form-grupo">
            <label for="cand-lista">Número de lista</label>
            <input type="text" id="cand-lista" class="form-input" placeholder="Ej: 1">
          </div>
          <div class="form-grupo">
            <label for="cand-propuesta">Propuesta</label>
            <textarea id="cand-propuesta" class="form-textarea" placeholder="Describe brevemente la propuesta del candidato..."></textarea>
          </div>
          <div class="form-grupo">
            <label for="cand-foto">Foto (URL opcional)</label>
            <input type="text" id="cand-foto" class="form-input" placeholder="https://...">
          </div>
          <button id="btn-registrar-candidato" class="btn btn-primario btn-bloque">
            <i class="ti ti-user-plus"></i> Registrar candidato
          </button>
        </div>

        <div class="card">
          <h3 class="mb-16">Candidatos registrados</h3>
          <div id="lista-candidatos">
            <div class="cargando"><i class="ti ti-loader"></i> Cargando...</div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <template id="tpl-candidato-card">
    <div class="cand-card-grande">
      <div class="cand-av-grande"></div>
      <div class="cand-info-grande" style="flex:1;">
        <h4 class="campo-nombre"></h4>
        <p class="lista campo-lista"></p>
        <p class="propuesta campo-propuesta"></p>
      </div>
      <button class="btn btn-xs btn-peligro btn-eliminar-candidato">
        <i class="ti ti-trash"></i>
      </button>
    </div>
  </template>

  <script src="../js/app.js"></script>
  <script src="../js/admin-candidatos.js"></script>
</body>
</html>
