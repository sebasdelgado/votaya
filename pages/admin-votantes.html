<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VotaYa — Votantes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body class="pagina flex flex-col">

  <div id="topbar"></div>
  <div id="sidebar"></div>

  <main class="main-admin ml-0 md:ml-sidebar-w">
    <div class="py-5 px-3.5 md:py-7 md:px-10 max-w-[1400px]">

      <div class="mb-6">
        <h2 class="font-titulo font-bold text-texto text-xl mb-1">Gestión de votantes</h2>
        <p class="text-sm text-texto-muted">Registra los estudiantes que podrán participar en las votaciones</p>
      </div>

      <div id="alerta-votantes" class="hidden"></div>

      <div class="mb-6 max-w-[600px]">

        <div class="card">
          <h3 class="font-titulo font-bold text-texto text-lg mb-4">Registrar votante</h3>
          <div class="mb-4">
            <label for="v-documento" class="label">Número de documento</label>
            <input type="text" id="v-documento" placeholder="Ej: 1005234567" class="input">
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="mb-4">
              <label for="v-nombre" class="label">Nombre</label>
              <input type="text" id="v-nombre" placeholder="Nombre" class="input">
            </div>
            <div class="mb-4">
              <label for="v-apellido" class="label">Apellido</label>
              <input type="text" id="v-apellido" placeholder="Apellido" class="input">
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="mb-4">
              <label for="v-nacimiento" class="label">Fecha de nacimiento</label>
              <input type="date" id="v-nacimiento" class="input">
            </div>
            <div class="mb-4">
              <label for="v-genero" class="label">Género</label>
              <select id="v-genero" class="input">
                <option value="">Seleccionar</option>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="mb-4">
              <label for="v-jornada" class="label">Jornada</label>
              <select id="v-jornada" class="input">
                <option value="">Seleccionar</option>
                <option value="mañana">Mañana</option>
                <option value="tarde">Tarde</option>
              </select>
            </div>
            <div class="mb-4">
              <label for="v-grupo" class="label">Grupo</label>
              <select id="v-grupo" class="input">
                <option value="">Seleccionar</option>
              </select>
            </div>
          </div>
          <button id="btn-registrar-votante" class="btn btn-primario w-full justify-center">
            <i class="ti ti-user-plus"></i> Registrar votante
          </button>
        </div>

      </div>

      <div class="card">
        <div class="flex items-center justify-between gap-3 mb-4">
          <h3 class="font-titulo font-bold text-texto text-lg">Votantes registrados (<span id="total-votantes">0</span>)</h3>
          <input type="text" id="buscador" placeholder="Buscar por nombre o documento..." class="input w-[240px]">
        </div>
        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr>
                <th class="tabla-th">Documento</th>
                <th class="tabla-th">Nombre</th>
                <th class="tabla-th">Grupo</th>
                <th class="tabla-th">Jornada</th>
                <th class="tabla-th">Género</th>
                <th class="tabla-th"></th>
              </tr>
            </thead>
            <tbody id="tabla-votantes">
              <tr><td colspan="6" class="cargando">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <template id="tpl-fila-votante">
    <tr class="hover:bg-fondo">
      <td class="campo-documento tabla-td text-texto-suave"></td>
      <td class="campo-nombre font-medium text-texto tabla-td"></td>
      <td class="campo-grupo tabla-td text-texto-suave"></td>
      <td class="campo-jornada tabla-td text-texto-suave"></td>
      <td class="campo-genero tabla-td text-texto-suave"></td>
      <td class="tabla-td">
        <button class="btn-eliminar-votante btn btn-chico btn-peligro">
          <i class="ti ti-trash"></i>
        </button>
      </td>
    </tr>
  </template>

  <script src="../js/app.js"></script>
  <script src="../js/admin-votantes.js"></script>
</body>
</html>
